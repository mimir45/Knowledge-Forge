name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # goreleaser derives the changelog from history

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      # Gate the release on the same checks CI runs. A tag is not a reason to skip them.
      - name: test
        run: |
          make lint
          CGO_ENABLED=1 go test ./...

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
