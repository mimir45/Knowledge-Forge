name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      # make lint is gofmt -l + go vet already; golangci-lint below adds staticcheck,
      # gosimple, ineffassign, unused and errcheck on top. errcheck was previously disabled
      # repo-wide; .golangci.yml also lifts golangci-lint's default
      # truncation, which was hiding 13 of 35 findings behind max-same-issues: 3.
      - name: lint
        run: make lint

      # install-mode: goinstall builds golangci-lint from source with the toolchain
      # actions/setup-go just installed, rather than downloading v1.64.8's prebuilt
      # binary (compiled with go1.24) — that binary refuses to run against this repo's
      # `go 1.26` directive ("the Go language version used to build golangci-lint is
      # lower than the targeted Go version"). Confirmed locally: `go run
      # .../golangci-lint@v1.64.8` (source build, local go1.26 toolchain) passes clean.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8
          install-mode: goinstall

      # Both lanes, because they are different programs. cgo on is what runs the
      # tree-sitter parser tests; cgo off is the invariant that every package except
      # pkg/codeindex builds without a C toolchain, and it is the lane that ships.
      - name: test (cgo)
        run: CGO_ENABLED=1 go test ./...

      - name: build (portable)
        run: CGO_ENABLED=0 go build ./...

      # A cross-compile failure that only appears at release time is a bad time to find
      # out, so the matrix is built on every push and thrown away.
      - name: cross-compile matrix
        run: make dist

      # forge recall/check must be byte-identical on repeated runs against the same
      # vault — this project's own measured invariant since Phase 2b, scripted here so
      # it's checked on every push rather than by hand each phase. See evals/README.md.
      - name: evals (determinism)
        run: ./evals/run.sh

  shim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: the shim must refuse a binary it cannot verify
        run: ./scripts/test-shim.sh
