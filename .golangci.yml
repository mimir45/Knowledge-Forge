run:
  timeout: 5m

issues:
  # golangci-lint truncates by default (max-issues-per-linter: 50, max-same-issues: 3), so
  # a repeated finding can be hidden rather than reported — measured once at 22 findings
  # truncated versus 35 whole. A lint gate that under-reports is worse than one that is noisy.
  max-issues-per-linter: 0
  max-same-issues: 0
